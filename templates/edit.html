<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Edit Student</h1>
    <form method="POST" action="{{ url_for('edit', id=student[0]) }}">
        <div class="mb-3">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" class="form-control" value="{{ student[1] }}" required>
        </div>
        <div class="mb-3">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" class="form-control" value="{{ student[2] }}" required>
        </div>
        <div class="mb-3">
            <label for="age">Age</label>
            <input type="number" name="age" id="age" class="form-control" value="{{ student[3] }}" required>
        </div>
        <div class="mb-3">
            <label for="course">Course</label>
            <input type="text" name="course" id="course" class="form-control" value="{{ student[4] }}" required>
        </div>
        <button type="submit" class="btn btn-success">Update</button>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Back</a>
    </form>    
</div>
</body>
</html>
